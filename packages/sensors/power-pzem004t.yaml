# Package: PZEM-004T AC Power Monitor
# pzemac uses Modbus protocol — requires uart → modbus → sensor chain.
# Required substitutions:
#   pzem_uart_tx_pin  — UART TX to PZEM RX (e.g. "GPIO15")
#   pzem_uart_rx_pin  — UART RX from PZEM TX (e.g. "GPIO33")
#   pzem_address      — Modbus slave address (default "0x01")
#   device_friendly_name

uart:
  - id: uart_pzem
    tx_pin: ${pzem_uart_tx_pin}
    rx_pin: ${pzem_uart_rx_pin}
    baud_rate: 9600
    stop_bits: 1

modbus:
  - id: modbus_pzem
    uart_id: uart_pzem

sensor:
  - platform: pzemac
    modbus_id: modbus_pzem
    address: ${pzem_address}
    current:
      name: "${device_friendly_name} Current"
    voltage:
      name: "${device_friendly_name} Voltage"
    power:
      name: "${device_friendly_name} Power"
    energy:
      name: "${device_friendly_name} Energy"
    frequency:
      name: "${device_friendly_name} Frequency"
    power_factor:
      name: "${device_friendly_name} Power Factor"
      internal: true
    update_interval: 10s
