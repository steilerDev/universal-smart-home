# Package: PZEM-004T AC Power Monitor
# Pins: GPIO1 (TX→PZEM RX), GPIO39 (RX←PZEM TX)
# GPIO1 is UART0 TX (logger serial). Disable serial logger below to free it.
# pzemac uses Modbus protocol — requires uart → modbus → sensor chain.
# Required substitutions:
#   pzem_uart_tx_pin  — GPIO1
#   pzem_uart_rx_pin  — GPIO39
#   device_friendly_name

# Free GPIO1 from the serial logger; network/API logging still works.
logger:
  baud_rate: 0

uart:
  - id: uart_pzem
    tx_pin: ${pzem_uart_tx_pin}
    rx_pin: ${pzem_uart_rx_pin}
    baud_rate: 9600
    stop_bits: 1

modbus:
  - id: modbus_pzem
    uart_id: uart_pzem

sensor:
  - platform: pzemac
    modbus_id: modbus_pzem
    current:
      name: "${device_friendly_name} Current"
    voltage:
      name: "${device_friendly_name} Voltage"
    power:
      name: "${device_friendly_name} Power"
    energy:
      name: "${device_friendly_name} Energy"
    frequency:
      name: "${device_friendly_name} Frequency"
    power_factor:
      name: "${device_friendly_name} Power Factor"
      internal: true
    update_interval: 10s
