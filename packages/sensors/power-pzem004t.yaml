# Package: PZEM-004T AC Power Monitor
# Pins: TBD — set substitutions once PCB schematic is finalised
# Required substitutions:
#   pzem_uart_tx_pin  — e.g. "GPIO14"
#   pzem_uart_rx_pin  — e.g. "GPIO15"
#   device_friendly_name

uart:
  - id: uart_pzem
    tx_pin: ${pzem_uart_tx_pin}
    rx_pin: ${pzem_uart_rx_pin}
    baud_rate: 9600

sensor:
  - platform: pzemac
    uart_id: uart_pzem
    current:
      name: "${device_friendly_name} Current"
      unit_of_measurement: A
    voltage:
      name: "${device_friendly_name} Voltage"
      unit_of_measurement: V
    power:
      name: "${device_friendly_name} Power"
      unit_of_measurement: W
    energy:
      name: "${device_friendly_name} Energy"
      unit_of_measurement: Wh
    frequency:
      name: "${device_friendly_name} Frequency"
      unit_of_measurement: Hz
    power_factor:
      name: "${device_friendly_name} Power Factor"
    update_interval: 10s
