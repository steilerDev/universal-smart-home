# Package: PZEM-004T AC Power Monitor
# pzemac uses Modbus protocol — requires uart → modbus → sensor chain.
#
# The meter lands on the BackPlate "Energy" header (E1) and reaches the ESP over
# the board-to-board connector. Pin names are ESP-perspective.
#
# Required substitutions:
#   device_friendly_name
#
# Optional substitutions — default to Rev 2/3 wiring:
#   pzem_uart_tx_pin  — ESP TX → PZEM RX (Rev 2/3: GPIO3 · Rev 1: GPIO33)
#   pzem_uart_rx_pin  — ESP RX ← PZEM TX (Rev 2/3: GPIO1 · Rev 1: GPIO39)
#   pzem_address      — Modbus slave address (default "0x01")
#
# ⚠️ Rev 2/3 runs this UART on GPIO1/GPIO3 — the two UART0 console pins, with
# their roles swapped relative to UART0's native TX/RX. Any device including
# this package MUST also set `logger: baud_rate: 0`, or the logger claims the
# same pins and the meter never answers.

substitutions:
  pzem_uart_tx_pin: "GPIO3"
  pzem_uart_rx_pin: "GPIO1"
  pzem_address: "0x01"

uart:
  - id: uart_pzem
    tx_pin: ${pzem_uart_tx_pin}
    rx_pin: ${pzem_uart_rx_pin}
    baud_rate: 9600
    stop_bits: 1

modbus:
  - id: modbus_pzem
    uart_id: uart_pzem

sensor:
  - platform: pzemac
    modbus_id: modbus_pzem
    address: ${pzem_address}
    current:
      name: "${device_friendly_name} Current"
    voltage:
      name: "${device_friendly_name} Voltage"
    power:
      name: "${device_friendly_name} Power"
    energy:
      name: "${device_friendly_name} Energy"
    frequency:
      name: "${device_friendly_name} Frequency"
    power_factor:
      name: "${device_friendly_name} Power Factor"
      internal: true
    update_interval: 10s
