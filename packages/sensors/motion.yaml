# Package: DFRobot C4002 mmWave Radar — Ceiling Presence Detection
#
# Radar plugs into MainPlate socket S1. Pin names below are ESP-perspective:
# motion_uart_tx_pin drives the radar's RX pin, motion_uart_rx_pin reads its TX.
#
# Required substitutions: room_width_m, room_depth_m, ceiling_height_m, device_friendly_name
#
# Optional substitutions — default to MainPlate Rev 2/3 wiring:
#   motion_uart_tx_pin  — ESP TX → radar RX (Rev 2/3: GPIO4  · Rev 1: GPIO2)
#   motion_uart_rx_pin  — ESP RX ← radar TX (Rev 2/3: GPIO35 · Rev 1: GPIO36)
#
# GPIO35 is input-only, which is fine for a UART RX line.

substitutions:
  motion_uart_tx_pin: "GPIO4"
  motion_uart_rx_pin: "GPIO35"

external_components:
  - source:
      type: local
      path: ../components
    components:
      - dfrobot_c4002

uart:
  - id: uart_motion
    tx_pin: ${motion_uart_tx_pin}
    rx_pin: ${motion_uart_rx_pin}
    baud_rate: 115200

dfrobot_c4002:
  id: radar_c4002
  uart_id: uart_motion
  room_width: ${room_width_m}
  room_depth: ${room_depth_m}
  ceiling_height: ${ceiling_height_m}

binary_sensor:
  - platform: dfrobot_c4002
    c4002_id: radar_c4002
    presence:
      name: "${device_friendly_name} Presence"
      device_class: occupancy
      filters:
        - delayed_off: 10s

number:
  - platform: dfrobot_c4002
    c4002_id: radar_c4002
    sensitivity_threshold:
      name: "${device_friendly_name} Radar Sensitivity"
      entity_category: config
    target_disappear_delay:
      name: "${device_friendly_name} Presence Hold Time"
      entity_category: config

switch:
  - platform: dfrobot_c4002
    c4002_id: radar_c4002
    calibrate:
      name: "${device_friendly_name} Radar Calibrate"
      entity_category: config
    factory_reset:
      name: "${device_friendly_name} Radar Factory Reset"
      entity_category: config
      internal: true

text_sensor:
  - platform: dfrobot_c4002
    c4002_id: radar_c4002
    c4002_text_sensor:
      name: "${device_friendly_name} Radar Log"
      entity_category: diagnostic
    gate_status:
      name: "${device_friendly_name} Radar Gates"
      entity_category: diagnostic
