# Package: DFRobot C4002 mmWave Radar — Ceiling Presence Detection
# Pins (fixed PCB layout): TX→GPIO02, RX→GPIO36
# Required substitutions: room_width_m, room_depth_m, ceiling_height_m, device_friendly_name

external_components:
  - source:
      type: local
      path: ../components
    components:
      - dfrobot_c4002

uart:
  - id: uart_motion
    tx_pin: GPIO02
    rx_pin: GPIO36
    baud_rate: 115200

dfrobot_c4002:
  id: radar_c4002
  uart_id: uart_motion
  room_width: ${room_width_m}
  room_depth: ${room_depth_m}
  ceiling_height: ${ceiling_height_m}

binary_sensor:
  - platform: dfrobot_c4002
    c4002_id: radar_c4002
    presence:
      name: "${device_friendly_name} Presence"
      device_class: occupancy
      filters:
        - delayed_off: 10s

number:
  - platform: dfrobot_c4002
    c4002_id: radar_c4002
    sensitivity_threshold:
      name: "${device_friendly_name} Radar Sensitivity"
      entity_category: config
    target_disappear_delay:
      name: "${device_friendly_name} Presence Hold Time"
      entity_category: config

switch:
  - platform: dfrobot_c4002
    c4002_id: radar_c4002
    calibrate:
      name: "${device_friendly_name} Radar Calibrate"
      entity_category: config
    factory_reset:
      name: "${device_friendly_name} Radar Factory Reset"
      entity_category: config
      internal: true

text_sensor:
  - platform: dfrobot_c4002
    c4002_id: radar_c4002
    c4002_text_sensor:
      name: "${device_friendly_name} Radar Log"
      entity_category: diagnostic
