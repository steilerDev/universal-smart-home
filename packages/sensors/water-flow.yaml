# Package: Water meter — one supply line (hall-effect pulse sensor, e.g. YF-B series)
#
# Include this package once per metered line, with `vars`:
#
#   packages:
#     flow_eg_kalt: !include
#       file: ../packages/sensors/water-flow.yaml
#       vars:
#         flow_key: eg_kalt
#         flow_name: "EG Kalt"
#         flow_pin: GPIO04
#         flow_pulses_per_liter: "396"
#
# Required vars:
#   flow_key               — slug used for entity IDs (C identifier: [a-z0-9_])
#   flow_name              — location label shown in HA ("EG Kalt")
#   flow_pin               — GPIO the sensor's pulse output is wired to
#   flow_pulses_per_liter  — this meter's pulses per litre (see Calibration)
#
# ── Calibration ──────────────────────────────────────────────────────────────
# Every meter model has its own K-factor, so the pulses-per-litre divisor is a
# per-include var rather than a constant shared by all eight lines. It is a
# BUILD-TIME value: change it here and re-flash, so the calibration of each line
# lives in git next to the pin it belongs to rather than in device flash.
#
# Datasheets usually quote the characteristic as `F = K * Q` with F in Hz and Q
# in L/min — pulses per litre is then `K * 60`. The YF-B series' K = 6.6 gives
# 6.6 * 60 = 396 pulses/L, which is the default carried over from the original
# hard-coded `x / 396` filter.
#
# pulse_counter always publishes in pulses/min regardless of update_interval, so
# `pulses_per_min / pulses_per_liter` is directly L/min — no extra time scaling.
#
# ── Resetting a meter total ──────────────────────────────────────────────────
# `restore: true` keys the stored total off the sensor's object_id, so it
# survives reboots AND re-flashes — re-flashing after a calibration change does
# NOT zero a total that was accumulated with the old pulses/L. Press the
# per-line "Water Volume Reset - <line>" button in HA to zero it.
#
# HA's long-term statistics keep the pre-reset history: `total_increasing` reads
# the drop to 0 as a meter reset (no negative spike), then carries on. Volume
# already recorded with a wrong pulses/L stays wrong in history — correct it in
# HA under Developer Tools → Statistics if it matters.
#
# ── Home Assistant energy dashboard ──────────────────────────────────────────
# The volume sensor carries `device_class: water` + `state_class: total_increasing`.
# HA's water dashboard only offers entities with BOTH — a bare `unit_of_measurement: L`
# (as the original config had) is accepted as a unit but never lists the entity as
# a water source. L / m³ / gal / ft³ / CCF are all valid water units.

sensor:
  - platform: pulse_counter
    id: water_flow_${flow_key}
    name: "Water Flow - ${flow_name}"
    pin:
      number: ${flow_pin}
      mode:
        input: true
    unit_of_measurement: "L/min"
    device_class: volume_flow_rate
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 5s
    filters:
      # x = pulses/min ÷ pulses/L → L/min
      - lambda: "return x / ${flow_pulses_per_liter};"

  - platform: integration
    id: water_volume_${flow_key}
    name: "Water Volume - ${flow_name}"
    sensor: water_flow_${flow_key}
    time_unit: min
    unit_of_measurement: "L"
    device_class: water
    state_class: total_increasing
    accuracy_decimals: 2
    # Without restore the meter total resets to 0 on every reboot/OTA. HA's
    # total_increasing handles the reset without corrupting statistics, but the
    # running total is lost — persist it instead. Writes are batched by the
    # global `preferences: flash_write_interval` (60s default), so this costs
    # one flash write a minute at most, shared with every other restored value.
    restore: true

button:
  - platform: template
    id: water_volume_reset_${flow_key}
    name: "Water Volume Reset - ${flow_name}"
    entity_category: config
    icon: mdi:restart
    on_press:
      - sensor.integration.reset: water_volume_${flow_key}
