# Package: Well water level — QDY30A submersible level transmitter over Modbus RTU
#
# Required substitutions:
#   well_uart_tx_pin      — UART TX → RS485 DI   (e.g. "GPIO03")
#   well_uart_rx_pin      — UART RX ← RS485 RO   (e.g. "GPIO35")
#   well_modbus_address   — Modbus slave address (default "0x01")
#   well_sensor_depth_cm  — how deep the probe hangs below the reference point
#   well_pump_depth_cm    — how deep the pump intake hangs below the same point
#
# ── What the sensor reports vs. what we publish ──────────────────────────────
# A submersible transmitter measures the water column ABOVE ITSELF — it knows
# nothing about the well or the pump. What matters operationally is how much
# water is still above the pump intake, i.e. how much can be drawn before the
# pump runs dry. Both depths are fixed by how the hardware was installed, so
# they are build-time substitutions, not runtime entities.
#
#   ─── well head (reference, depth 0) ───────────────
#            │
#            ~~~~~~~~~~~~~ water surface ────┐
#            │                               │ raw (column above probe)
#            ● probe   @ well_sensor_depth_cm┘  ─┐
#            │                                  │ offset = pump - sensor
#            ▓ pump intake @ well_pump_depth_cm ─┘
#
#   water_surface_depth = well_sensor_depth_cm - raw
#   above_pump          = well_pump_depth_cm - water_surface_depth
#                       = raw + (well_pump_depth_cm - well_sensor_depth_cm)
#
# So the correction is a plain offset of (pump depth - sensor depth), and it is
# sign-agnostic — the same expression is right for either install:
#
#   probe ABOVE the intake (our install: probe 1500, pump 1600) → offset +100 cm
#     …the probe is 1 m of water column short of the intake, so we ADD it back.
#   probe BELOW the intake (probe 1600, pump 1500)              → offset -100 cm
#     …the probe sees 1 m of water the pump can never reach, so we SUBTRACT it.
#
# The value is deliberately NOT clamped at zero — a negative reading is the
# meaningful "water surface has dropped below the pump intake" signal.
#
# ⚠ MEASUREMENT FLOOR when the probe sits above the intake
# A submersible transmitter reads 0 once it is no longer submerged; it cannot
# report a surface below itself. With the probe at 1500 and the intake at 1600,
# everything in the last 100 cm above the intake — exactly the range that decides
# whether the pump is about to run dry — reads the same: raw 0 → published 100 cm.
# So the published value is a FLOOR, not an exact level, whenever it sits at the
# offset. The `Well Probe Uncovered` binary sensor below marks precisely that
# condition, so automations can treat "100 cm" as "≤100 cm, unknown" instead of
# trusting it. Hanging the probe below the intake would remove the blind spot.

uart:
  - id: uart_well
    tx_pin: ${well_uart_tx_pin}
    rx_pin: ${well_uart_rx_pin}
    baud_rate: 9600
    data_bits: 8
    stop_bits: 1
    parity: NONE

modbus:
  - id: modbus_well
    uart_id: uart_well

modbus_controller:
  - id: modbus_well_master
    address: ${well_modbus_address}
    modbus_id: modbus_well
    setup_priority: -10
    update_interval: 2s

sensor:
  - platform: modbus_controller
    modbus_controller_id: modbus_well_master
    id: well_level
    # Name kept verbatim (including the "Waserstand" typo) from the pre-repo
    # config — it is what sensor.waserstand_brunnen in HA is keyed on, and
    # renaming it would orphan the existing history and automations.
    name: "Waserstand Brunnen"
    register_type: holding
    value_type: S_WORD
    address: 0x0004
    force_new_range: true
    device_class: distance
    state_class: measurement
    icon: mdi:car-coolant-level
    unit_of_measurement: cm
    accuracy_decimals: 1
    filters:
      # Install geometry → water level above the pump intake. See the diagram above.
      - lambda: "return x + (${well_pump_depth_cm} - ${well_sensor_depth_cm});"
      - throttle_average: 20s

binary_sensor:
  - platform: template
    id: well_probe_uncovered
    name: "Well Probe Uncovered"
    device_class: problem
    entity_category: diagnostic
    icon: mdi:waves-arrow-down
    # Published level is post-offset, so "raw <= 0" is "published <= offset".
    # The 0.5 cm margin absorbs averaging noise around a bone-dry probe.
    lambda: |-
      if (!id(well_level).has_state()) return {};
      const float offset = ${well_pump_depth_cm} - ${well_sensor_depth_cm};
      return id(well_level).state <= offset + 0.5f;
