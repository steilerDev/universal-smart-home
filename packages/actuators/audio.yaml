# Package: ES8311 + NS4150B — I2S Audio (notification sounds / TTS)
#
# ⚠️ Rev 1 boards only. The MainPlate Rev 2/3 dropped the ES8311/NS4150B section
# entirely, and two of the Rev 1 audio pins are now spoken for: GPIO13 is I2C SDA
# and GPIO1 is the PZEM UART RX. There are therefore no Rev 2/3 defaults here —
# every pin below stays a required substitution so that including this package on
# a Rev 2/3 device fails loudly instead of quietly fighting the I2C bus.
# Bus: I2C for DAC control (bus_i2c defined in base/room-sensor.yaml), I2S for audio data
# ES8311 address: 0x18
# Required substitutions:
#   audio_bclk_pin    — I2S bit clock       (e.g. "GPIO5")
#   audio_lrclk_pin   — I2S LR clock        (e.g. "GPIO13")
#   audio_dout_pin    — I2S data out to DAC  (e.g. "GPIO14")
#   audio_din_pin     — I2S data in from mic (e.g. "GPIO15")
#   audio_mclk_pin    — I2S MCLK output     (must be GPIO0/1/3 on ESP32 — hardware CLK_OUT pins only)
#   device_friendly_name
# Note: MCLK on GPIO1 requires UART0 logger disabled; add logger: baud_rate: 0 in the device file.

i2s_audio:
  - id: bus_i2s
    i2s_lrclk_pin: ${audio_lrclk_pin}
    i2s_bclk_pin: ${audio_bclk_pin}
    i2s_mclk_pin: ${audio_mclk_pin}

audio_dac:
  - platform: es8311
    id: es8311_dac
    address: 0x18
    use_mclk: true
    use_microphone: false

speaker:
  - platform: i2s_audio
    id: i2s_speaker
    i2s_audio_id: bus_i2s
    dac_type: external
    audio_dac: es8311_dac
    i2s_dout_pin: ${audio_dout_pin}

media_player:
  - platform: speaker
    name: "${device_friendly_name} Speaker"
    id: media_player_speaker
    buffer_size: 32768
    announcement_pipeline:
      speaker: i2s_speaker
      format: FLAC

rtttl:
  id: rtttl_beeper
  speaker: i2s_speaker

microphone:
  - platform: i2s_audio
    id: mic_i2s
    i2s_audio_id: bus_i2s
    i2s_din_pin: ${audio_din_pin}
    adc_type: external
    pdm: false

