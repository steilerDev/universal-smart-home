# Package: KRIDA I2C MOSFET Trailing-Edge AC Dimmer
# Bus: I2C (bus_i2c defined in base/room-sensor.yaml)
# Address: 0x10
# Required substitutions: device_friendly_name

external_components:
  - source: github://tomavc/KRIDA_i2c_Dimmer_EspHome@main
    components: [i2c_dimmer]

light:
  - platform: i2c_dimmer
    name: "${device_friendly_name} Main Light"
    address: 0x10
    channel: 0x80
    default_transition_length: 3s
    restore_mode: ALWAYS_OFF
