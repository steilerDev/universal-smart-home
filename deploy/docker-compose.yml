# ESPHome Device Builder + the Claude agent, colocated in one stack.
#
# The agent runs INSIDE the Docker network, behind the existing Authentik gate:
#   - browsers → https://esphome.<domain> → Authentik SSO (unchanged)
#   - the agent (claude container) → ws://esphome-builder:6052/ws on the internal
#     `esphome-net` — no auth, no JWT, the builder's native auth stays unset.
#
# The repo is bind-mounted into BOTH containers at /repo, so the agent's edits to
# devices/*.yaml are visible to the builder INSTANTLY — no git-sync sidecar. Git
# stays the durable source of truth: commit + push is a post-deploy save step.
#
# Setup (see deploy/README.md): the host checkout lives at /opt/docker/home_esp
# with a real secrets.yaml at its root, then `cp .env.example .env` and edit.
services:
  esphome-builder:
    image: ghcr.io/esphome/esphome:latest
    container_name: esphome-builder
    # The builder's config scanner is top-level only, so point it straight at
    # devices/. The rest of the repo stays on disk for ../packages, ../components
    # and the devices/secrets.yaml -> ../secrets.yaml symlink.
    command: ["esphome-device-builder", "/repo/devices"]
    environment:
      # Build artifacts / venvs / job logs live off the repo on a named volume.
      ESPHOME_DATA_DIR: /data
      # NOTE: ESPHOME_USERNAME / ESPHOME_PASSWORD are intentionally UNSET.
      # Authentik gates the browser UI; the agent reaches the builder on the
      # internal network, so no native auth is needed (and setting it would
      # collide with the Authorization header the outpost consumes).
    volumes:
      - ${ESPHOME_REPO_DIR:?set ESPHOME_REPO_DIR in .env to the host repo checkout}:/repo
      - esphome-data:/data
    expose:
      - "6052"          # internal networks only — never published to the host
    networks:
      - authentik       # reachable by the Authentik outpost (browser SSO)
      - esphome-net     # reachable by the claude container (agent deploys)
      - egress          # outbound to GitHub / PlatformIO / device LAN
    restart: unless-stopped

  claude:
    build:
      context: ..
      dockerfile: deploy/claude.Dockerfile
    container_name: claude
    working_dir: /repo
    # Long-running; attach an interactive agent with:
    #   docker exec -it claude claude
    command: ["sleep", "infinity"]
    environment:
      # In-network builder — no Authentik, no JWT.
      ESPHOME_BUILDER_URL: ws://esphome-builder:6052/ws
    volumes:
      # SAME checkout as the builder → edits are instantly visible to it.
      - ${ESPHOME_REPO_DIR:?set ESPHOME_REPO_DIR in .env to the host repo checkout}:/repo
      # Reuse the host's Claude login + settings (no API key in-repo).
      - ${CLAUDE_CONFIG_DIR:?set CLAUDE_CONFIG_DIR in .env to the host ~/.claude}:/root/.claude
    networks:
      - esphome-net     # talk to the builder
      - egress          # outbound to api.anthropic.com / GitHub / pip / npm
    depends_on:
      - esphome-builder
    restart: unless-stopped

volumes:
  esphome-data:

networks:
  # The existing Authentik outpost network. Rename via AUTHENTIK_NETWORK in .env.
  authentik:
    external: true
    name: ${AUTHENTIK_NETWORK:-authentik}
  # Private builder <-> agent link. Not published, not the Authentik network.
  esphome-net:
    driver: bridge
  egress:
    driver: bridge
