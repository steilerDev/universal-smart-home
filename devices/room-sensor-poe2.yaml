# Prototype — Room Sensor POE2
# Matches previously deployed config: room-sensor-poe2 @ 10.10.14.20
# Capabilities: climate, illuminance, GPIO expander (buttons + switches)

substitutions:
  device_name: room-sensor-poe2
  device_friendly_name: "Room Sensor POE2"
  device_ip: "10.10.14.20"
  i2c_sda_pin: "GPIO03"
  i2c_scl_pin: "GPIO04"
  pzem_uart_tx_pin: "GPIO33"
  pzem_uart_rx_pin: "GPIO39"
  audio_bclk_pin: "GPIO5"
  audio_lrclk_pin: "GPIO13"
  audio_dout_pin: "GPIO14"
  audio_din_pin: "GPIO15"
  audio_mclk_pin: "GPIO1"
  # NeoPixel on GPIO32 — GPIO33 is taken by PZEM UART TX on this device
  led_pin: "GPIO32"
  led_num_leds: "1"

# MCLK on GPIO1 requires UART0 logger disabled (GPIO1 = UART0 TX)
logger:
  baud_rate: 0

packages:
  base:        !include ../packages/base/room-sensor.yaml
  climate:     !include ../packages/sensors/climate.yaml
  illuminance: !include ../packages/sensors/illuminance.yaml
  gpio_ext:    !include ../packages/io/gpio-extender.yaml
  dimmer:      !include ../packages/actuators/dimmer.yaml
  motion:      !include ../packages/sensors/motion.yaml
  power:       !include ../packages/sensors/power-pzem004t.yaml
  audio:       !include ../packages/actuators/audio.yaml
  status_led:  !include ../packages/actuators/status-led.yaml

binary_sensor:
  - id: !extend button_1
    on_press:
      - rtttl.play: 'beep:d=8,o=5,b=180:a'
