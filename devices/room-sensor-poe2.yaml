# Prototype — Room Sensor POE2 @ 10.10.14.20
# RoomSensor MainPlate Rev 2/3. Every GPIO comes from the package defaults —
# this board IS the reference wiring, so there are no pin overrides here.
#
# BackPlate is not connected yet. Everything it carries stays commented out:
#   gpio_ext (PCF8574 buttons/relays/blinds), dimmer (L1), power (PZEM on E1).
# Enabled packages are all main-plate: I2C climate + illuminance, radar, LED.

substitutions:
  device_name: room-sensor-poe2
  device_friendly_name: "Room Sensor POE2"
  device_ip: "10.10.14.20"
  room_width_m: "4.0"
  room_depth_m: "5.0"
  ceiling_height_m: "2.4"

# Serial logging is disabled in the base package (logger: baud_rate: 0) because
# the PZEM UART owns GPIO1/GPIO3 — UART0's console pins. Logs go over the API.

packages:
  base:        !include ../packages/base/room-sensor.yaml
  climate:     !include ../packages/sensors/climate.yaml
  illuminance: !include ../packages/sensors/illuminance.yaml
  motion:      !include ../packages/sensors/motion.yaml
  status_led:  !include ../packages/actuators/status-led.yaml
  # --- BackPlate required, not yet connected ---
  # power:       !include ../packages/sensors/power-pzem004t.yaml
  # gpio_ext:    !include ../packages/io/gpio-extender.yaml
  # dimmer:      !include ../packages/actuators/dimmer.yaml
  # --- Rev 1 only, never populated ---
  # audio:       !include ../packages/actuators/audio.yaml
